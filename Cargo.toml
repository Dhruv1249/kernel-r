[package]
name = "kernel-r"
version = "0.1.0"
edition = "2024"

[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pc-keyboard = "0.7.0"
xmas-elf = "0.10.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[features]
test = []

[lib]
name = "kernel_r"
crate-type = ["staticlib"]
