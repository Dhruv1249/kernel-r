name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin lld

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build artifacts
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Create GitHub release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: kernel.iso,kernel.elf
          body_path: ARCHITECTURE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
